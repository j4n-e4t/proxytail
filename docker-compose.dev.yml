# Development stack: Traefik in Docker, proxytail running on the host (`bun run dev`). Like production, Traefik reaches
# tailnet peers through the host's Tailscale (Docker Desktop sends container traffic through the host's network stack).
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml --profile demo up -d   # + an ephemeral whoami test peer
name: proxytail

services:
  # Hands Traefik's volumes to its unprivileged user (65532).
  volume-init:
    image: busybox:1.37
    restart: "no"
    network_mode: none
    command:
      - sh
      - -c
      - chown -R 65532:65532 /volumes/* && chmod 700 /volumes/letsencrypt
    volumes:
      - traefik-acme:/volumes/letsencrypt
      - ${DATA_DIR:-./data}/traefik-logs:/volumes/traefik-logs

  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.13}
    user: "65532:65532"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${HTTP_PORT:-80}:8000"
      - "${HTTPS_PORT:-443}:8443"
      # Traefik's API, for the app on the host. Loopback only on the host side.
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - traefik-acme:/letsencrypt
      # The access log, for the app on the host (it reads data/traefik-logs/access.log by default).
      - ${DATA_DIR:-./data}/traefik-logs:/var/log/traefik
    # The same static configuration as docker-compose.yml.
    environment:
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":8000"
      # All HTTP traffic is redirected to HTTPS (ACME HTTP-01 challenges on :80 are still answered first).
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: ":${HTTPS_PORT:-443}"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_PERMANENT: "true"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":8443"
      # Drop request headers whose name aliases one Traefik manages, blocking header-spoofing against the backend.
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ALIASHEADERSSTRATEGY: delete
      # Conflicting TLS options become an error instead of falling back to the no-client-cert default (GHSA-g55h-rg46-x9c5).
      TRAEFIK_CORE_STRICTTLSOPTIONS: "true"
      # Let's Encrypt via the HTTP-01 challenge. Dev defaults to the staging CA (untrusted certs, generous rate
      # limits) since a dev machine usually isn't reachable from the internet; set ACME_CA_SERVER to override.
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE: "true"
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE_ENTRYPOINT: web
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE: /letsencrypt/acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL:-}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_CASERVER: ${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      TRAEFIK_API_INSECURE: "true"
      TRAEFIK_API_DASHBOARD: "false"
      TRAEFIK_PING: "true"
      TRAEFIK_GLOBAL_CHECKNEWVERSION: "false"
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: "false"
      TRAEFIK_PROVIDERS_HTTP_ENDPOINT: http://host.docker.internal:${PORT:-3000}/api/traefik/config
      TRAEFIK_PROVIDERS_HTTP_POLLINTERVAL: 5s
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_ACCESSLOG: "true"
      TRAEFIK_ACCESSLOG_FILEPATH: /var/log/traefik/access.log
      TRAEFIK_ACCESSLOG_FORMAT: json
      # Only what the Requests page shows: time, client IP, hostname, the router (service) it matched, status and
      # response time. Paths, query strings and headers are never written.
      TRAEFIK_ACCESSLOG_FIELDS_DEFAULTMODE: drop
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_StartUTC: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_ClientHost: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_RequestHost: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_RouterName: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_DownstreamStatus: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_Duration: keep
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_DEFAULTMODE: drop
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Rate limit counters, when Valkey is chosen under Security → Rate limiting. Traefik reaches it as valkey:6379, the
  # app on the host on loopback (VALKEY_ADDR, default localhost:6379).
  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-9.1}-alpine
    command: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 32mb, --maxmemory-policy, allkeys-lru]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    restart: unless-stopped

  # Optional test peer: joins the tailnet as "proxytail-demo" (ephemeral) and serves demo-app on :80.
  # It advertises the backend tag, so the tag must exist in your policy's tagOwners.
  demo-tailscale:
    profiles: [demo]
    image: tailscale/tailscale:latest
    hostname: proxytail-demo
    environment:
      TS_AUTHKEY: ${TS_DEMO_AUTHKEY:-${TS_AUTHKEY}}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --advertise-tags=${TS_BACKEND_TAG:-tag:proxytail-backend}
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  # Echoes each request like traefik/whoami, as an HTML page with its own favicon (demo/server.ts).
  demo-app:
    profiles: [demo]
    image: oven/bun:1.3.13-alpine
    command: bun /demo/server.ts
    volumes:
      - ./demo:/demo:ro
    network_mode: service:demo-tailscale
    depends_on:
      - demo-tailscale
    restart: unless-stopped

volumes:
  traefik-acme:
