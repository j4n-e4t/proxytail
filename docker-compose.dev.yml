# Development stack: Traefik + Tailscale sidecar in Docker, proxytail running on the host (`bun run dev`).
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml --profile demo up -d   # + an ephemeral whoami test peer
name: proxytail

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-proxytail}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    restart: unless-stopped

  traefik:
    image: traefik:v3.5
    network_mode: service:tailscale
    volumes:
      - traefik-acme:/letsencrypt
    depends_on:
      - tailscale
    command:
      - --entrypoints.web.address=:80
      # All HTTP traffic is redirected to HTTPS (ACME HTTP-01 challenges on :80 are still answered first).
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      # Let's Encrypt via the HTTP-01 challenge. Dev defaults to the staging CA (untrusted certs, generous rate
      # limits) since a dev machine usually isn't reachable from the internet; set ACME_CA_SERVER to override.
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      - --api.insecure=true
      - --providers.http.endpoint=http://host.docker.internal:${PORT:-3000}/api/traefik/config
      - --providers.http.pollInterval=5s
      - --log.level=INFO
      - --accesslog=true
    restart: unless-stopped

  # Optional test peer: joins the tailnet as "proxytail-demo" (ephemeral) and serves traefik/whoami on :80.
  demo-tailscale:
    profiles: [demo]
    image: tailscale/tailscale:latest
    hostname: proxytail-demo
    environment:
      TS_AUTHKEY: ${TS_DEMO_AUTHKEY:-${TS_AUTHKEY}}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  demo-whoami:
    profiles: [demo]
    image: traefik/whoami
    network_mode: service:demo-tailscale
    depends_on:
      - demo-tailscale
    restart: unless-stopped

volumes:
  tailscale-state:
  traefik-acme:
