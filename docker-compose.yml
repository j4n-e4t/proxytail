# Production stack for a dedicated proxy host that is already on your tailnet (tailscaled on the host, kernel mode).
#   cp .env.example .env   # set the OAuth client
#   docker compose up -d   # pulls ghcr.io/j4n-e4t/proxytail (or `--build` to build locally)
#   tailscale serve --bg --https=8443 http://127.0.0.1:3000   # publish the UI on the tailnet
#
# There is no login: whoever can reach the UI has full access. It's only published on the host's loopback, and
# `tailscale serve` puts it on the tailnet, where the tailnet policy decides who can reach it.
# Traefik reaches tailnet peers through the host's routing table, i.e. the host's tailscale0.
name: proxytail

services:
  app:
    image: ${PROXYTAIL_IMAGE:-ghcr.io/j4n-e4t/proxytail:latest}
    build: .
    restart: unless-stopped
    environment:
      # All interfaces inside the container; the port is only published on the host's loopback below.
      HOST: 0.0.0.0
      TRAEFIK_API_URL: http://traefik:8080
      TRAEFIK_TLS_ADDR: traefik:443
      TS_OAUTH_CLIENT_ID: ${TS_OAUTH_CLIENT_ID:-}
      TS_OAUTH_CLIENT_SECRET: ${TS_OAUTH_CLIENT_SECRET:-}
      TS_TAILNET: ${TS_TAILNET:-}
      TS_BACKEND_TAG: ${TS_BACKEND_TAG:-}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-}
      UI_HOSTS: ${UI_HOSTS:-}
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000"
    volumes:
      - proxytail-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - traefik-acme:/letsencrypt
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    command:
      - --entrypoints.web.address=:80
      # All HTTP traffic is redirected to HTTPS (ACME HTTP-01 challenges on :80 are still answered first).
      # A port rather than "websecure", so the redirect targets the published port when HTTPS_PORT isn't 443.
      - --entrypoints.web.http.redirections.entrypoint.to=:${HTTPS_PORT:-443}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      # Let's Encrypt via the HTTP-01 challenge: every service gets a certificate automatically.
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # Unauthenticated API on :8080, only reachable on the Docker network (not published): proxytail reads router
      # status from it.
      - --api.insecure=true
      - --providers.http.endpoint=http://app:3000/api/traefik/config
      - --providers.http.pollInterval=5s
      - --log.level=INFO
      - --accesslog=true

volumes:
  proxytail-data:
  traefik-acme:
