# Production stack for a dedicated proxy host that is already on your tailnet (tailscaled on the host, kernel mode).
#   cp .env.example .env   # set the OAuth client
#   docker compose up -d   # pulls ghcr.io/j4n-e4t/proxytail (or `--build` to build locally)
#   tailscale serve --bg --https=8443 http://127.0.0.1:3000   # publish the UI on the tailnet
#
# There is no login: whoever can reach the UI has full access. It's only published on the host's loopback, and
# `tailscale serve` puts it on the tailnet, where the tailnet policy decides who can reach it.
# Traefik reaches tailnet peers through the host's routing table, i.e. the host's tailscale0.
name: proxytail

# Docker's own logs (stdout/stderr) are rotated, so a chatty container can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: ${PROXYTAIL_IMAGE:-ghcr.io/j4n-e4t/proxytail:latest}
    build: .
    restart: unless-stopped
    environment:
      # All interfaces inside the container; the port is only published on the host's loopback below.
      HOST: 0.0.0.0
      TRAEFIK_API_URL: http://traefik:8080
      TRAEFIK_TLS_ADDR: traefik:8443
      TLS_MIN_VERSION: ${TLS_MIN_VERSION:-1.2}
      VALKEY_ADDR: valkey:6379
      TS_OAUTH_CLIENT_ID: ${TS_OAUTH_CLIENT_ID:-}
      TS_OAUTH_CLIENT_SECRET: ${TS_OAUTH_CLIENT_SECRET:-}
      TS_TAILNET: ${TS_TAILNET:-}
      TS_BACKEND_TAG: ${TS_BACKEND_TAG:-}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-}
      UI_HOSTS: ${UI_HOSTS:-}
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000"
    volumes:
      - proxytail-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${APP_MEM_LIMIT:-256m}
    pids_limit: 256
    logging: *logging

  # Hands Traefik's volumes to its unprivileged user (65532), including volumes a root Traefik created before (main).
  volume-init:
    image: busybox:1.37
    restart: "no"
    network_mode: none
    command:
      - sh
      - -c
      - chown -R 65532:65532 /volumes/* && chmod 700 /volumes/letsencrypt
    volumes:
      - traefik-acme:/volumes/letsencrypt
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    pids_limit: 16
    logging: *logging

  # Runs as an unprivileged user (65532) instead of the image's root. It listens on unprivileged ports, so it needs no
  # capabilities at all; Docker publishes them on 80 and 443.
  #
  # The static configuration comes from environment variables rather than flags, so an override file can add to it
  # (Traefik reads one source only: flags would have to be repeated in full).
  traefik:
    # Current stable line. Older lines (e.g. v3.5) no longer receive the mTLS and request-smuggling fixes shipped to
    # v3.6.11/v3.7.x, several of which apply to this config.
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.13}
    restart: unless-stopped
    user: "65532:65532"
    depends_on:
      app:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-80}:8000"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":8000"
      # All HTTP traffic is redirected to HTTPS (ACME HTTP-01 challenges on :80 are still answered first).
      # The published port rather than "websecure", whose port only exists inside the container.
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: ":${HTTPS_PORT:-443}"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_PERMANENT: "true"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":8443"
      # Drop request headers whose name aliases one Traefik manages (e.g. X_Forwarded_Tls_Client_Cert_Info), so a
      # client can't smuggle a forged value that a CGI/WSGI/PHP/NGINX backend reads as the real header.
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ALIASHEADERSSTRATEGY: delete
      # Mark conflicting TLS options as an error instead of silently falling back to the (no-client-cert) default,
      # which would drop a service's mTLS requirement. See Traefik advisory GHSA-g55h-rg46-x9c5.
      TRAEFIK_CORE_STRICTTLSOPTIONS: "true"
      # Let's Encrypt via the HTTP-01 challenge: every service gets a certificate automatically.
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE: "true"
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE_ENTRYPOINT: web
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE: /letsencrypt/acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL:-}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_CASERVER: ${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # Unauthenticated API on :8080, only reachable on the Docker network (not published): proxytail reads router
      # status from it. The dashboard is off; the API is all proxytail needs.
      TRAEFIK_API_INSECURE: "true"
      TRAEFIK_API_DASHBOARD: "false"
      # For the healthcheck below, on the same internal :8080.
      TRAEFIK_PING: "true"
      TRAEFIK_GLOBAL_CHECKNEWVERSION: "false"
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: "false"
      TRAEFIK_PROVIDERS_HTTP_ENDPOINT: http://app:3000/api/traefik/config
      TRAEFIK_PROVIDERS_HTTP_POLLINTERVAL: 5s
      TRAEFIK_LOG_LEVEL: INFO
      # Access log on stdout, rotated by Docker.
      TRAEFIK_ACCESSLOG: "true"
    volumes:
      - traefik-acme:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${TRAEFIK_MEM_LIMIT:-512m}
    pids_limit: 512
    logging: *logging

  # Keeps the rate limit counters when Valkey is chosen under Settings → Rate limiting. Only reachable on the Docker
  # network. The counters are short-lived, so nothing is written to disk, and memory is capped.
  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-9.1}-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - allkeys-lru
    # The image's valkey user; running as it skips the entrypoint's chown and privilege drop.
    user: "999:1000"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 64
    logging: *logging

volumes:
  proxytail-data:
  traefik-acme:
