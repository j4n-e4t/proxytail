name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - name: Compile binary
        run: bun run build

      - name: Smoke test
        run: |
          DATA_DIR="$RUNNER_TEMP/data" ./dist/proxytail &
          for _ in $(seq 1 20); do ./dist/proxytail healthcheck && break; sleep 0.5; done
          ./dist/proxytail healthcheck
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">'
          # Traefik's config is written to a file, and the endpoint is admin-only.
          grep -q '{}' "$RUNNER_TEMP/data/traefik/proxytail.yaml"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/traefik/config)" = 403

  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      # No QEMU needed: the Dockerfile cross-compiles on the native builder platform.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/proxytail
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
